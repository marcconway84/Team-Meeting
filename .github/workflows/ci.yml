name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  packs:
    # The packs and the build: a malformed pack should fail here, not in someone's
    # ten minutes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Named explicitly: the cache looks for requirements.txt by default, and
          # this repo's only dependency file is the dev one.
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: The page still builds
        run: python scripts/build.py

  worker:
    # The leaderboard recalculates every score it is sent, so it has to agree with
    # the game to the point. These run the worker for real against a local database.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Scoring, matching and clue tests
        run: npm test

      - name: End-to-end tests against a real worker
        run: npm run test:service
        env:
          CI: "1"
