# Publishes the game to GitHub Pages.
#
# ONE-TIME SETUP, and it cannot be done from here: go to
# Settings -> Pages -> Source and choose "GitHub Actions". Until that is done the
# deploy step fails with a 404, because there is no Pages site to deploy to.
#
# Enabling it from inside the workflow was tried and does not work:
# actions/configure-pages with enablement:true is refused with "Resource not
# accessible by integration", because creating a Pages site needs admin rights on
# the repository and the workflow token does not have them. pages:write is enough
# to deploy to a site that exists, not to bring one into being.
#
# Note: on the free plan, Pages only serves public repositories.
name: Publish the game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the site
        run: python scripts/build.py --site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
