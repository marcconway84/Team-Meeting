# Publishes the game to GitHub Pages.
#
# Nothing to switch on by hand: the configure-pages step below enables Pages for
# the repository on its first run, using the workflow's own token, and is a no-op
# once it is on. That needs the `pages: write` permission granted below.
#
# Note: on the free plan, Pages only serves public repositories.
name: Publish the game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Turns Pages on if it is not already, rather than failing the deploy with a
      # 404 and leaving someone to go and find the setting.
      - name: Make sure Pages is switched on
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build the site
        run: python scripts/build.py --site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
