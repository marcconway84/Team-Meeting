# Deploys the game server to Cloudflare.
#
# This runs here rather than from a laptop because it keeps the deploy credential in
# GitHub's secret store instead of on anyone's machine.
#
# One repository secret is needed, under Settings -> Secrets and variables -> Actions:
#
#   CLOUDFLARE_API_TOKEN   a token with Workers Scripts:Edit and D1:Edit
#
# Everything else is automatic: this workflow deploys the server, plays a game
# through it to prove it works, writes the address into data/leaderboard.json,
# commits that, and asks the publish workflow to rebuild the page. The only thing
# you have to keep is the host key it prints in the summary.
#   HOST_KEY               optional; the passphrase that unlocks the start button.
#                          One is generated on the first deploy if you do not set one,
#                          and printed to this workflow's summary.
#
# The account id is in wrangler.toml. It is an identifier, not a credential - it
# appears in the address bar of the Cloudflare dashboard - so it does not need hiding.
#
# The workflow is safe to run repeatedly. It creates the database only if it is not
# already there, applies the schema with CREATE TABLE IF NOT EXISTS, and invents a
# signing secret only on the first deploy, so existing rounds are not invalidated by
# a redeploy.
name: Deploy the game server

on:
  workflow_dispatch:

permissions:
  # write, because the last step commits the deployed address back into the repo
  # so nobody has to copy it by hand; actions, because a push made with the
  # built-in token does not trigger other workflows, so the publish is asked for
  # explicitly.
  contents: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check the credential is there
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Test before deploying
        run: |
          npm test
          npm run test:service

      - name: Find or create the database
        id: database
        run: |
          set -euo pipefail
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "quickfire-scores") | .uuid' || true)
          if [ -z "$id" ]; then
            echo "No database yet - creating one."
            npx wrangler d1 create quickfire-scores
            id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "quickfire-scores") | .uuid')
          else
            echo "Reusing the existing database."
          fi
          if [ -z "$id" ]; then echo "::error::could not determine the database id"; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Point the config at it
        run: sed -i "s/PLACEHOLDER/${{ steps.database.outputs.id }}/" wrangler.toml

      - name: Apply the schema
        run: npx wrangler d1 execute quickfire-scores --remote --file=schema.sql

      - name: Set the host key, once
        id: hostkey
        env:
          SUPPLIED: ${{ secrets.HOST_KEY }}
        run: |
          set -euo pipefail
          # Whoever has this can start and reset a game, so it is only set when the
          # worker does not already have one - a redeploy mid-meeting must not lock
          # the host out of their own game.
          existing=$(npx wrangler secret list --name quickfire-scores 2>/dev/null || echo '[]')
          if echo "$existing" | grep -q HOST_KEY; then
            echo "Host key already set - leaving it alone."
            echo "made=no" >> "$GITHUB_OUTPUT"
          else
            key="${SUPPLIED:-$(openssl rand -hex 8)}"
            printf '%s' "$key" | npx wrangler secret put HOST_KEY --name quickfire-scores
            echo "made=yes" >> "$GITHUB_OUTPUT"
            if [ -z "$SUPPLIED" ]; then echo "key=$key" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: Deploy
        id: deploy
        run: npx wrangler deploy 2>&1 | tee deploy.log

      - name: Prove it actually works
        env:
          KEY: ${{ steps.hostkey.outputs.key || secrets.HOST_KEY }}
        run: |
          set -euo pipefail
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Testing $url"
          if [ -z "$KEY" ]; then
            echo "::notice::Host key already set and not supplied here, so the host routes are not exercised."
            curl -fsS "$url/game" | jq -e '.phase' > /dev/null
            echo "Service is answering."
            exit 0
          fi

          # A whole game, played through the live service exactly as the room plays
          # one. The development sandbox cannot reach workers.dev, so this is the
          # only place the real thing gets checked.
          post() { curl -fsS -X POST "$url$1" -H 'content-type: application/json' -d "$2"; }

          post /host/open "{\"key\":\"$KEY\",\"round\":\"sept-28\"}" | jq -e '.phase == "lobby"' > /dev/null
          post /join '{"player":"smoke-1","name":"Smoke"}' | jq -e '.players == 1' > /dev/null

          # Scoring before the off must be refused.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url/progress" \
            -H 'content-type: application/json' -d '{"player":"smoke-1","found":5,"clues":[]}')
          [ "$code" = "400" ] || { echo "::error::scored before the start (HTTP $code)"; exit 1; }

          ends=$(post /host/start "{\"key\":\"$KEY\"}" | jq -r .endsAt)
          [ "$ends" != "null" ] || { echo "::error::no end time after start"; exit 1; }

          # A made-up total must not be believed: 4 found, one 20-point clue.
          score=$(post /progress '{"player":"smoke-1","found":4,"clues":["where"],"score":9999999}' | jq -r .you.score)
          [ "$score" = "380" ] || { echo "::error::scored $score, expected 380"; exit 1; }

          # And an impossible one must be refused outright.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url/progress" \
            -H 'content-type: application/json' -d '{"player":"smoke-1","found":99,"clues":[]}')
          [ "$code" = "400" ] || { echo "::error::accepted 99 out of 19 (HTTP $code)"; exit 1; }

          # Only the host may start or reset.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url/host/start" \
            -H 'content-type: application/json' -d '{"key":"not-the-key"}')
          [ "$code" = "403" ] || { echo "::error::a stranger could start the game (HTTP $code)"; exit 1; }

          post /host/open "{\"key\":\"$KEY\"}" | jq -e '.players == 0' > /dev/null
          echo "Live service played a full game correctly."

      - name: Point the game at the server it just deployed
        working-directory: .
        run: |
          set -euo pipefail
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' worker/deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::the deploy log did not contain an address"
            exit 1
          fi
          python3 - "$url" <<'PY'
          import json, sys
          from pathlib import Path
          config = Path("data/leaderboard.json")
          data = json.loads(config.read_text(encoding="utf-8"))
          if data.get("url") == sys.argv[1]:
              print("The game already points there.")
          else:
              data["url"] = sys.argv[1]
              config.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
              print(f"Pointed the game at {sys.argv[1]}")
          PY
          if git diff --quiet -- data/leaderboard.json; then
            echo "changed=no" >> "$GITHUB_ENV"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Point the game at the deployed server" -- data/leaderboard.json
          git push
          echo "changed=yes" >> "$GITHUB_ENV"

      - name: Publish the page with the address in it
        if: env.changed == 'yes'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A push made with the built-in token does not set other workflows off,
          # so the publish is asked for by name rather than waited for in vain.
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Asked the publish workflow to rebuild the page."

      - name: Say where it went
        working-directory: .
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' worker/deploy.log | head -1 || true)
          {
            echo "### The game server is live"
            echo
            if [ -n "$url" ]; then
              echo "Address: \`$url\`"
              echo
              echo "It has been written into \`data/leaderboard.json\` and the page is rebuilding."
            else
              echo "Deployed, but the address was not in the log - check the run above."
            fi
            if [ "${{ steps.hostkey.outputs.made }}" = "yes" ] && [ -n "${{ steps.hostkey.outputs.key }}" ]; then
              echo
              echo "## Your host key"
              echo
              echo "\`\`\`"
              echo "${{ steps.hostkey.outputs.key }}"
              echo "\`\`\`"
              echo
              echo "**Copy this now - it is not printed anywhere else.**"
              echo
              echo "To host a game, open:"
              echo
              echo "\`https://marcconway84.github.io/Team-Meeting/?host=${{ steps.hostkey.outputs.key }}\`"
              echo
              echo "Everyone else just opens \`https://marcconway84.github.io/Team-Meeting/\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
